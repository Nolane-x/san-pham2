name: Bootstrap source snapshot

on:
  push:
    branches: [nolane-studio-release]
    paths: [bootstrap/READY]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand tested source snapshot
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import shutil
          import tempfile
          import zipfile
          from pathlib import Path

          root = Path('.').resolve()
          chunks = sorted((root / 'bootstrap').glob('chunk-*.txt'))
          if not chunks:
              raise SystemExit('no source chunks found')
          payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
          archive = Path(tempfile.gettempdir()) / 'nolane-source.zip'
          archive.write_bytes(base64.b64decode(payload))
          extract = Path(tempfile.mkdtemp(prefix='nolane-source-'))
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(extract)

          for child in list(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          for child in extract.iterdir():
              shutil.move(str(child), root / child.name)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upload Nolane Studio release candidate"
          git push origin HEAD:nolane-studio-release
